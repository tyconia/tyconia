[package]
name = "tyconia"
version = "0.1.0"
publish = false
authors = ["Niklas Eicker <git@nikl.me>", "Yor Qat"]
edition = "2021"
exclude = ["dist", "build", "assets", "credits"]

[package.metadata.project]
qualifier = "com"
organization = "allurestudios"
application = "tyconic"
support_link = "https://ko-fi.com/yorqat"

# Dependencies at opt-level 3 made dev builds extremely slow; 1 is a good compromise.
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
# `dist` keeps full LTO for final distribution builds.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]

# All of Bevy's default features exept for the audio related ones (bevy_audio, vorbis), since they clash with bevy_kira_audio
#   and android_shared_stdcxx/android-game-activity, since those are covered in `mobile`
[dependencies]
bevy = { version = "0.15.3", default-features = false, features = [
    # "file_watcher",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_picking",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_picking_backend",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "serialize",
    "webgl2",
    "x11",
] }
bevy_kira_audio = { version = "0.21" }
bevy_asset_loader = { version = "0.22" }
bevy_ecs_tilemap = { version = "0.15" }
webbrowser = { version = "1", features = ["hardened"] }

ron = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
directories = { version = "5.0.1" }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

[build-dependencies]
embed-resource = "1"
cargo_metadata = "0.14"
